# Linear probe: frozen encoder (last layer) + 1x1 conv head, 20 epochs.
#   python -m aquabench.cli fit --config configs/linear.yaml --encoder dinov3_base --ds cou
seed_everything: 42
encoder: dinov3_base
head: linear
task: semantic_seg
ds: cou
model:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
data:
  # data_dir defaults to $DATA_ROOT/unified (see aquabench/data); override here or with --data.data_dir.
  batch_size: 32
  num_workers: 8
  augmentation: medium
trainer:
  max_epochs: 50
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  default_root_dir: logs/linear
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args: {save_dir: logs/linear}
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/miou
        mode: max
        save_top_k: 1
        filename: "best-{epoch:02d}-{val/miou:.4f}"
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        filename: "last"
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/miou_all
        mode: max
        save_top_k: 1
        filename: "bestall-{epoch:02d}"
