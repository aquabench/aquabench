[project]
name = "aquabench"
dynamic = ["version"]
description = "Underwater semantic segmentation benchmark for prepared encoders (plain PyTorch)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
download = ["datasets>=2.14"]
test = ["pytest"]

[project.scripts]
aquabench = "aquabench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "aquabench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["aquabench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
